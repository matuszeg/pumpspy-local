name: Validate

# Runs the same checks HACS and Home Assistant run against this repository, so a
# packaging mistake shows up here rather than in someone else's failed install.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Both actions track moving targets. A weekly run catches a rule that
    # tightened upstream while nothing here changed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        env:
          # Keeps the action's GitHub API calls authenticated. Without it they
          # are anonymous, which is rate limited, and which returned nothing at
          # all back when this repository was private: every file check failed
          # with "expected a dictionary. Got None".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          category: integration

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component tracks Home Assistant,
          # which requires 3.14. Pinning 3.13 here fails at pip install.
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
