# pumpspy-local fail-open shim.
#
# Intercepting the device's traffic means Home Assistant now stands between it
# and the vendor. Without something like this, HA being down -- a core restart,
# an update, a broken integration -- also stops the device reaching PumpSpy, and
# it drops an event for good after three quick retries. That trades real flood
# alerting for local monitoring, which is the wrong way round.
#
# This config puts nginx in front. Each request goes to Home Assistant, and
# straight to the vendor if Home Assistant does not answer. Local monitoring
# pauses during an outage; vendor alerting does not.
#
# Copy this file into your nginx configuration (see docs/fail-open-shim.md for
# where it should run), replace HOME_ASSISTANT below with the address Home
# Assistant listens on, and point your DNS or NAT redirect at nginx instead.
#
# Three settings here are load-bearing. Each was established by replaying real
# captured device traffic, and each fails in a way that still looks healthy.
# Do not tidy them away.
#
#   proxy_request_buffering off
#       Every GET this device sends carries a stale "Content-Length: 148" and
#       then sends no body at all. With buffering on, nginx waits for 148 bytes
#       that never arrive, never forwards the request, and returns 400 once the
#       device gives up -- silently killing the firmware polls while telemetry,
#       which does have a body, keeps flowing and hides it.
#
#   max_fails=0 on the Home Assistant server
#       Otherwise one failed request marks Home Assistant down for fail_timeout,
#       and every request in that window bypasses it. Telemetry would stop being
#       recorded while both Home Assistant and the vendor looked perfectly fine.
#       Judge each request on its own instead: a refused connection is detected
#       in microseconds, so there is nothing to save.
#
#   proxy_set_header Host $http_host
#       Passed through verbatim so the shim is invisible and the vendor sees the
#       Host the device sent, not the address of the machine nginx runs on.

log_format pumpspy '$time_iso8601 $remote_addr "$request" -> $upstream_addr '
                   'upstream=$upstream_status in ${upstream_response_time}s, '
                   'device_got=$status';

upstream pumpspy {
    server HOME_ASSISTANT:8081 max_fails=0;   # Home Assistant
    server www.pumpspy.com:8081 backup;       # the vendor
}

server {
    listen 8081 default_server;
    listen [::]:8081 default_server;
    server_name _;

    access_log /var/log/nginx/pumpspy.log pumpspy;

    proxy_set_header Host $http_host;
    proxy_http_version 1.1;

    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_next_upstream_tries 3;

    # Everything, including the bodyless GETs described above. Failing over
    # still works here despite the unbuffered body: a refused connection is
    # detected before any body has been streamed.
    location / {
        proxy_pass http://pumpspy;
        proxy_request_buffering off;
        proxy_next_upstream error timeout;
    }

    # The device's POSTs, whose bodies are real. Buffered, so that when Home
    # Assistant is up but cannot reach the vendor -- it answers 502 -- nginx can
    # replay the body to the vendor itself rather than handing the failure down
    # to the device, which drops the event after three tries.
    location ~ ^/(bbs_json|pings|pump_outlet_alerts)$ {
        proxy_pass http://pumpspy;
        proxy_next_upstream error timeout http_502 http_504 non_idempotent;
    }

    # Local-only liveness. Answers without touching either upstream, so it says
    # exactly one thing: nginx is up and serving. Poll it from wherever your
    # redirect is configured and withdraw the redirect when it stops answering,
    # so that this machine failing sends the device back to the vendor on its
    # own rather than cutting it off.
    location = /shim-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
