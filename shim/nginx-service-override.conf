# Keep nginx from staying dead after a boot that outran DNS.
#
# nginx resolves the vendor's addresses while *parsing* its configuration, not
# on first use, so a host that reaches nginx before a resolver is answering
# fails the config test outright:
#
#   [emerg] host not found in upstream "www.pumpspy.com:8081"
#
# nginx exits, and nothing tries again. The shim is then down until a human
# notices -- and nothing draws attention to it, because withdrawing the
# redirect (see "When the shim itself dies") sends the device straight to the
# vendor, so the vendor's app goes on looking perfectly healthy while local
# monitoring records nothing. On the reference install this cost three hours.
#
# Ordering after nss-lookup.target handles the common case. The restart is what
# actually covers it, because nothing guarantees a resolver is answering the
# instant that target is reached, and a retry ten seconds later almost always
# finds one that is.
#
# Install as /etc/systemd/system/nginx.service.d/override.conf, then
# `systemctl daemon-reload`.

[Unit]
Wants=network-online.target
After=network-online.target nss-lookup.target
# Retry for as long as it takes. If the configuration is genuinely broken the
# retries change nothing -- the health endpoint stays silent and the redirect
# stays withdrawn, which is the fail-open outcome we want anyway.
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10s
